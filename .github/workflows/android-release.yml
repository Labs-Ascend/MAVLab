name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Labs-Ascend/MAVLab'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mavlab-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify release tag
        run: |
          python3 ../scripts/check-release-docs.py --publish --tag "${GITHUB_REF_NAME}"
          python3 ../scripts/test_release_assets.py
          expected_tag="v$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match app version ${expected_tag}." >&2
            exit 1
          fi
      - name: Verify and build release artifacts
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease bundleRelease
      - name: Verify release variant and signing guards
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/MAVlab.apk > "${RUNNER_TEMP}/mavlab-release-badging.txt"
          if grep -q '^application-debuggable' "${RUNNER_TEMP}/mavlab-release-badging.txt"; then
            echo 'Refusing to publish a debuggable release APK' >&2
            exit 1
          fi
          python3 ../scripts/test_release_signing.py \
            --apk app/build/outputs/apk/release/MAVlab.apk \
            --aab app/build/outputs/bundle/release/app-release.aab
      - name: Prepare release assets
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
          cp app/build/outputs/apk/release/MAVlab.apk \
            "${GITHUB_WORKSPACE}/release-artifacts/MAVLab-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "${GITHUB_WORKSPACE}/release-artifacts/MAVLab-${GITHUB_REF_NAME}.aab"
      - name: Sign APK and AAB with permanent release identity
        # v1.6.0 alone is manually published from the verified local debug build.
        # Future releases retain the stable signing requirement.
        if: github.ref_name != 'v1.6.0'
        env:
          MAVLAB_APK_KEYSTORE_B64: ${{ secrets.MAVLAB_APK_KEYSTORE_B64 }}
          MAVLAB_APK_STORE_PASSWORD: ${{ secrets.MAVLAB_APK_STORE_PASSWORD }}
          MAVLAB_APK_KEY_ALIAS: ${{ secrets.MAVLAB_APK_KEY_ALIAS }}
          MAVLAB_APK_KEY_PASSWORD: ${{ secrets.MAVLAB_APK_KEY_PASSWORD }}
          MAVLAB_APK_CERT_SHA256: ${{ vars.MAVLAB_APK_CERT_SHA256 }}
        run: |
          export MAVLAB_APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          signing_stage=$(mktemp -d "${RUNNER_TEMP}/mavlab-apk-signed-XXXXXX")
          bash ../scripts/sign-release-build.sh app/build/outputs/apk/release/MAVlab.apk \
            "${signing_stage}/MAVLab-${GITHUB_REF_NAME}.apk"
          bash ../scripts/sign-release-build.sh app/build/outputs/bundle/release/app-release.aab \
            "${signing_stage}/MAVLab-${GITHUB_REF_NAME}.aab"
          cp "${signing_stage}/MAVLab-${GITHUB_REF_NAME}.aab" \
            "${GITHUB_WORKSPACE}/release-artifacts/MAVLab-${GITHUB_REF_NAME}.aab"
          cp "${signing_stage}/MAVLab-${GITHUB_REF_NAME}.apk" \
            "${GITHUB_WORKSPACE}/release-artifacts/MAVLab-${GITHUB_REF_NAME}.apk"
      - name: Checksum final release assets
        run: |
          cd "${GITHUB_WORKSPACE}/release-artifacts"
          sha256sum MAVLab-* > SHA256SUMS.txt
      - name: Publish or update GitHub release
        if: github.ref_name != 'v1.6.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_notes="${GITHUB_WORKSPACE}/docs/v${version//./_}_release_notes.md"
          if [ ! -f "${release_notes}" ]; then
            echo "Missing release notes: ${release_notes}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MAVLab ${GITHUB_REF_NAME}" \
              --notes-file "${release_notes}"
            gh release upload "${GITHUB_REF_NAME}" \
              "${GITHUB_WORKSPACE}/release-artifacts/MAVLab-${GITHUB_REF_NAME}.apk" \
              "${GITHUB_WORKSPACE}/release-artifacts/MAVLab-${GITHUB_REF_NAME}.aab" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${GITHUB_WORKSPACE}/release-artifacts/MAVLab-${GITHUB_REF_NAME}.apk" \
              "${GITHUB_WORKSPACE}/release-artifacts/MAVLab-${GITHUB_REF_NAME}.aab" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MAVLab ${GITHUB_REF_NAME}" \
              --notes-file "${release_notes}" \
              --verify-tag
          fi
      - name: Archive v1.6.0 CI comparison build (not public distribution)
        if: github.ref_name == 'v1.6.0'
        uses: actions/upload-artifact@v4
        with:
          name: v1.6.0-ci-comparison-not-distribution
          path: release-artifacts/
          retention-days: 7

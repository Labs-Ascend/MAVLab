name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mavlab-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Documentation and release metadata
        # Candidate notes are allowed in CI; publishing uses the stricter gate.
        run: python3 ../scripts/check-release-docs.py
      - name: Documentation checker tests
        run: python3 ../scripts/test_check_release_docs.py
      - name: Build-only release attachment tests
        run: python3 ../scripts/test_release_assets.py
      - name: Lint Android
        run: ./gradlew lintDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mavlab-debug-apk
          path: mavlab-android/app/build/outputs/apk/debug/app-debug.apk
